/* ------------------------------ AUDIO ------------------------------ */
const Sound = {
  ctx:null, muted:false,
  init(){
    if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, dur, type='sine', vol=0.14, slide=null){
    if(this.muted || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  click(){ this.tone(660,0.06,'square',0.07); },
  press(){ this.tone(340,0.1,'triangle',0.12,520); },
  coin(){ this.tone(1180,0.09,'sine',0.1); setTimeout(()=>this.tone(1560,0.12,'sine',0.09),70); },
  sizzle(){ this.tone(90,0.5,'sawtooth',0.05,60); },
  powerUp(){ this.tone(300,0.35,'sawtooth',0.1,1400); },
  zither(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>this.tone(f,0.5,'sine',0.09),i*70)); },
  bass(){ this.tone(70,0.5,'sine',0.2,40); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,'triangle',0.11),i*80)); },
  demon(){ this.tone(130,0.6,'sawtooth',0.14,60); },
  toggle(){ this.muted = !this.muted; gs.sound = !this.muted; saveGame(); toast(this.muted?'🔇 Tắt âm':'🔊 Bật âm'); }
};

function initScene(){
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  $('#c').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x120a1e);
  scene.fog = new THREE.FogExp2(0x120a1e, 0.035);

  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(0, 3.0, 6.4);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.15, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.minDistance = 3;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI/2.05;
  controls.minPolarAngle = 0.35;
  controls.zoomSpeed = 0.9;
  controls.rotateSpeed = 0.85;

  /* --- Lights --- */
  scene.add(new THREE.AmbientLight(0xbfc7ff, 0.55));
  const hemi = new THREE.HemisphereLight(0xffd6f5, 0x2a1a3d, 0.45); scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffd9a0, 1.55);
  sun.position.set(5.5, 8.5, 4.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 28;
  sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
  sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
  sun.shadow.bias = -0.0008;
  scene.add(sun);

  const fill = new THREE.PointLight(0x9b6bff, 0.9, 16, 2);
  fill.position.set(-4, 3.5, 3); scene.add(fill);

  /* --- Floor --- */
  const floorMat = new THREE.MeshStandardMaterial({ color:0x1a1030, roughness:0.92, metalness:0.1 });
  const floor = new THREE.Mesh(new THREE.CircleGeometry(22, 64), floorMat);
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);

  buildRuneCircle();
  buildFogPlanes();
  buildCounter();
  buildBunny(gs.skin);
  buildCakes();
  buildRealmFX();
  buildAura();
  buildPartyFloor();
  buildDust();

  cakeGroup = new THREE.Group(); scene.add(cakeGroup);

  clock = new THREE.Clock();
  addEventListener('resize', onResize);
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

/* ---------------- Rune circle (procedural canvas texture) ---------------- */
function runeTexture(){
  const s = 512, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const x = cv.getContext('2d');
  x.clearRect(0,0,s,s);
  x.strokeStyle = 'rgba(244,114,182,.85)'; x.lineWidth = 3;
  for(const r of [230,205,150,120]){ x.beginPath(); x.arc(256,256,r,0,Math.PI*2); x.stroke(); }
  x.strokeStyle = 'rgba(250,204,21,.70)'; x.lineWidth = 2;
  for(let i=0;i<24;i++){
    const a = i/24*Math.PI*2;
    x.beginPath();
    x.moveTo(256+Math.cos(a)*120, 256+Math.sin(a)*120);
    x.lineTo(256+Math.cos(a)*230, 256+Math.sin(a)*230);
    x.stroke();
  }
  const glyphs = '乾坤震巽坎離艮兌金丹元神仙佛魔靈';
  x.font = 'bold 26px serif'; x.fillStyle = 'rgba(140,255,235,.92)';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for(let i=0;i<16;i++){
    const a = i/16*Math.PI*2;
    x.save();
    x.translate(256+Math.cos(a)*178, 256+Math.sin(a)*178);
    x.rotate(a+Math.PI/2);
    x.fillText(glyphs[i%glyphs.length], 0, 0);
    x.restore();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  return tex;
}
let runeMesh = null;
function buildRuneCircle(){
  const mat = new THREE.MeshBasicMaterial({
    map: runeTexture(), transparent:true, opacity:0.55,
    blending: THREE.AdditiveBlending, depthWrite:false, side: THREE.DoubleSide
  });
  runeMesh = new THREE.Mesh(new THREE.PlaneGeometry(9,9), mat);
  runeMesh.rotation.x = -Math.PI/2;
  runeMesh.position.y = 0.012;
  scene.add(runeMesh);
}

/* ---------------- Volumetric fog planes ---------------- */
const fogPlanes = [];
function softTexture(){
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const x = cv.getContext('2d');
  const g = x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(180,140,255,.55)');
  g.addColorStop(0.55,'rgba(120,80,200,.18)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
function buildFogPlanes(){
  const tex = softTexture();
  for(let i=0;i<7;i++){
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(9,9),
      new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0.09, blending:THREE.AdditiveBlending, depthWrite:false })
    );
    m.position.set(rnd(-7,7), rnd(0.4,2.6), rnd(-6,6));
    m.rotation.z = rnd(0,Math.PI);
    m.userData.spd = rnd(0.05,0.16);
    m.userData.dir = Math.random()>0.5?1:-1;
    scene.add(m); fogPlanes.push(m);
  }
}

    vel[i*3]   = Math.cos(ang)*0.12;

    color:a.color, size:0.075, transparent:true, opacity:0.9,

    const curl = new THREE.Mesh(new THREE.SphereGeometry(0.055 + Math.random()*0.02,7,7), mH);
    curl.position.set(Math.cos(a)*0.135, 0.20 + Math.random()*0.10, Math.sin(a)*0.115);
    if(i > 7) curl.scale.setScalar(1.35);
    head.add(curl);
  }
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,0.018,20), mHat); brim.position.y = 0.285; head.add(brim);
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.145,0.16,0.16,16), mHat); crown.position.y = 0.375; head.add(crown);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.162,0.162,0.03,16), mG); band.position.y = 0.302; head.add(band);

  torso.add(head); G.add(torso);
  G.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return { group:G, parts:{ legL, legR, armL, armR, torso, head } };
}

function danceStep(d, t, dt){
  const P = d.parts, s = Math.sin;
  P.legL.rotation.set(0,0,0); P.legR.rotation.set(0,0,0);
  P.armL.rotation.set(0,0,0); P.armR.rotation.set(0,0,0);
  P.torso.rotation.set(0,0,0);
  d.group.rotation.set(0, d.baseRot, 0);
  d.group.position.set(d.home.x, 0, d.home.z);

  if(d.style === 'moonwalk'){
    d.group.position.x = d.home.x + s(t*0.9)*0.85;
    P.legL.rotation.x =  s(t*6)*0.55;
    P.legR.rotation.x = -s(t*6)*0.55;
    P.armL.rotation.x = -0.6 + s(t*6)*0.45;
    P.armR.rotation.x = -0.6 - s(t*6)*0.45;
    d.group.position.y = Math.abs(s(t*3))*0.03;
  } else if(d.style === 'spin'){
    d.spin = (d.spin||0) + dt*6;
    d.group.rotation.y = d.baseRot + d.spin;
    P.armL.rotation.z = 1.35; P.armR.rotation.z = -1.35;
    P.legL.rotation.z = 0.12; P.legR.rotation.z = -0.12;
    d.group.position.y = Math.abs(s(t*8))*0.10;
  } else if(d.style === 'lean'){
    const k = Math.max(0, s(t*1.1)) * 0.72;
    d.group.rotation.x = k;
    d.group.position.z = d.home.z + k*0.35;
    P.armL.rotation.x = -0.9; P.armR.rotation.x = -0.9;
  } else if(d.style === 'kick'){
    P.legR.rotation.x = -Math.abs(s(t*3))*1.15;
    P.armL.rotation.x = -1.45; P.armR.rotation.x = 0.5;
    d.group.position.y = Math.abs(s(t*3))*0.10;
  } else {
    const q = Math.sign(s(t*9));
    P.armL.rotation.z = 0.95*q; P.armR.rotation.z = -0.95*q;
    P.armL.rotation.x = -0.45; P.armR.rotation.x = -0.45;
    d.group.rotation.z = 0.12*s(t*5);
  }
  P.head.rotation.y = 0.45*s(t*2.4);
  P.head.rotation.z = 0.06*s(t*2.0);
}

const confetti = [];
function burst(pos, color, n){
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.05), new THREE.MeshBasicMaterial({ color }));
    m.position.copy(pos);
    m.userData.v = new THREE.Vector3((Math.random()-0.5)*3, 2+Math.random()*3, (Math.random()-0.5)*3);
    m.userData.life = 1.1;
    scene.add(m); confetti.push(m);
  }
}
function updateConfetti(dt){
  for(let i=confetti.length-1;i>=0;i--){
    const b = confetti[i];
    b.userData.v.y -= 5*dt;
    b.position.addScaledVector(b.userData.v, dt);
    b.rotation.x += dt*6; b.rotation.y += dt*4;
    b.userData.life -= dt;
    if(b.userData.life <= 0){
      scene.remove(b); b.geometry.dispose(); b.material.dispose(); confetti.splice(i,1);
    }
  }
}

const customers = [];
function makeCustomer(star){

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.30, 0.95, 10),
    new THREE.MeshStandardMaterial({ color:robeColor, roughness:0.8, metalness:0.05 }));
  body.position.y = 0.48; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 14, 12),
    new THREE.MeshStandardMaterial({ color:0xf0c9a0, roughness:0.9 }));
  head.position.y = 1.13; g.add(head);
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.26, 10),
    new THREE.MeshStandardMaterial({ color: star ? 0x0d0d0d : 0x3b2a4d, roughness:0.6 }));
  hat.position.y = 1.33; g.add(hat);
  if(star){
    const glove = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.3 }));
    glove.position.set(0.28, 0.72, 0.16); g.add(glove);
  }
  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return g;
}
function spawnCustomer(){
  if(customers.length >= 5) return;
  const star = Math.random() < 0.10;
  const g = makeCustomer(star);
  const side = Math.random() > 0.5 ? 1 : -1;
  g.position.set(side*7, 0, FLOOR_Z + rnd(-0.4, 0.9));
  scene.add(g);
  const target = new THREE.Vector3(rnd(-1.6,1.6), 0, 1.35);
  customers.push({ g, target, star, state:'walk', wait:0, patience:26, walkT:0 });
}
function updateCustomers(dt, t){
  for(let i=customers.length-1;i>=0;i--){
    const c = customers[i];
    if(c.state === 'walk'){
      const d = c.target.clone().sub(c.g.position);
      const dist = d.length();
      if(dist < 0.12){ c.state = 'wait'; }
      else {
        d.normalize();
        c.walkT += dt*6;
        c.g.position.addScaledVector(d, dt*1.5);
        c.g.position.y = Math.abs(Math.sin(c.walkT))*0.05;
        c.g.rotation.y = Math.atan2(d.x, d.z);
      }
    } else if(c.state === 'wait'){
      c.wait += dt;
      c.g.position.y = Math.abs(Math.sin(t*2.2 + i))*0.02;
      if(c.wait > c.patience){ scene.remove(c.g); disposeNode(c.g); customers.splice(i,1); continue; }
    }
  }
}
function sellAll(){
  if(!gs.inventory.length) return toast('Không có bánh để bán!');
  let total = 0, maxR = 0;
  gs.inventory.forEach(it=>{ total += cakePrice(it); maxR = Math.max(maxR, it.r||0); });
  const bonus = customers.filter(c=>c.state==='wait').length;
  if(bonus) total = Math.round(total * (1 + Math.min(bonus,5)*0.06));
  gs.money += total; gs.totalSold += gs.inventory.length;
  gs.inventory = [];
  refreshCakes(); refreshHUD(); saveGame();
  Sound.coin();
  burst(new THREE.Vector3(0, 1.2, 0.4), 0xffd166, 22);
  toast(`Bán ${gs.totalSold !== 0 ? '' : ''}${''}+${total} 💰${bonus?` (thưởng ${bonus} khách)`:''}`);
  customers.forEach(c=>{ if(c.state==='wait'){ c.state='leave'; c.target = new THREE.Vector3(c.g.position.x*3, 0, 6); } });
}

function cakePrice(it){
  const base = (25 + (it.s||50)*1.6);
  const rar = RARITY[it.r||0].x;
  return Math.round(base * rar * realmMult() * qualityMul() * petFox());
}

function openModal(html, box){

function closeModal(){ const r = $('#modalRoot'); r.innerHTML = ''; r.style.pointerEvents = 'none'; }

let gaugeActive = null; // hook cho Space
function runGaugeFlow(title, onDone){
  const box = openModal(`
    <div class="mb-2 flex items-center justify-between">
      <h3 class="text-sm font-black tracking-wide text-pink-300">${title}</h3>
      <button id="gfX" class="rounded px-2 text-slate-400 hover:text-white">✕</button>
    </div>
    <div id="gfStep" class="mb-1 text-[11px] font-bold text-amber-200"></div>
    <div id="gfStage" class="relative h-40 w-full overflow-hidden rounded-xl bg-slate-950 ring-1 ring-white/10"></div>
    <div id="gfInfo" class="mt-1 text-[11px] text-slate-400"></div>
    <button id="gfBtn" class="mt-2 w-full rounded-xl bg-gradient-to-r from-pink-500 to-amber-400 py-2 text-xs font-black text-black">CHỐT!</button>
  `);
  const stage = box.querySelector('#gfStage'), info = box.querySelector('#gfInfo');
  const stepEl = box.querySelector('#gfStep'), btn = box.querySelector('#gfBtn');
  let step = 1, score = 0, running = true, raf = null, pos = 0, dir = 1, slider = 50;
  const perfect = [71, 87], fry = [62, 82];

  box.querySelector('#gfX').onclick = ()=>{ running = false; closeModal(); gaugeActive = null; };

  function renderStage(){
    if(step === 1 || step === 3){
      const [a,b] = step === 1 ? perfect : fry;
      stage.innerHTML = `
        <div class="absolute inset-x-6 top-1/2 h-3 -translate-y-1/2 rounded-full bg-slate-800"></div>
        <div class="absolute top-1/2 h-3 -translate-y-1/2 rounded-full bg-emerald-400/70"
             style="left:${6 + a*0.88}%;width:${(b-a)*0.88}%"></div>
        <div id="needle" class="absolute top-1/2 h-16 w-1 -translate-y-1/2 rounded bg-pink-400 shadow-[0_0_12px_#f472b6]"></div>
        <div class="absolute inset-x-0 bottom-2 text-center text-[10px] font-bold text-slate-500">VÙNG HOÀN HẢO ${a}–${b}</div>`;
    } else {
      stage.innerHTML = `
        <div class="absolute inset-x-6 top-1/2 h-3 -translate-y-1/2 rounded-full bg-slate-800"></div>
        <div id="slFill" class="absolute top-1/2 h-3 -translate-y-1/2 rounded-full bg-amber-400"></div>
        <div class="absolute top-1/2 h-8 w-1 -translate-y-1/2 rounded bg-emerald-400" style="left:${6+52*0.88}%"></div>
        <div class="absolute inset-x-0 bottom-2 text-center text-[10px] font-bold text-slate-500">KÉO ĐỂ CHỌN ĐỘ DÀY · CHUẨN 52</div>`;
      const fill = stage.querySelector('#slFill');
      fill.style.left = '6%'; fill.style.width = (slider*0.88) + '%';
    }
  }
  function label(){
    stepEl.textContent = step === 1 ? 'BƯỚC 1/3 · ÉP CHUỐI CỬU THIÊN' :
                         step === 2 ? 'BƯỚC 2/3 · LĂN BỘT THẦN Y' :
                                     'BƯỚC 3/3 · CHIÊN BÁNH HỎA TRẬN';
    info.textContent = `Điểm: ${Math.round(score)}`;
  }

  function needleLoop(){
    if(!running) return;
    pos += dir * 1.55;
    if(pos >= 100){ pos = 100; dir = -1; }
    if(pos <= 0){ pos = 0; dir = 1; }
    const n = stage.querySelector('#needle');
    if(n) n.style.left = (6 + pos*0.88) + '%';
    raf = requestAnimationFrame(needleLoop);
  }

  function advance(){
    if(step === 3){
      running = false;
      if(raf) cancelAnimationFrame(raf);
      gaugeActive = null;
      closeModal();
      onDone(Math.round(score));
      return;
    }
    step++;
    renderStage(); label();
    if(step === 3){ Sound.sizzle(); needleLoop(); }
  }

  function confirm(){
    if(!running) return;
    if(step === 1){
      const [a,b] = perfect;
      const inZone = pos >= a && pos <= b;
      score += inZone ? 26 + 4*(1 - Math.abs(pos - (a+b)/2)/((b-a)/2)) : Math.max(0, 30 - Math.abs(pos-79)*0.85);
      Sound.press(); toast(inZone ? '✅ Perfect!' : 'Trượt vùng vàng…');
      if(raf) cancelAnimationFrame(raf);
      advance();
    } else if(step === 2){
      score += 35 * clamp(1 - Math.abs(slider - 52)/48, 0, 1);
      Sound.press();
      advance();
    } else {
      const [a,b] = fry;
      const inZone = pos >= a && pos <= b;
      score += inZone ? 26 + 4*(1 - Math.abs(pos - (a+b)/2)/((b-a)/2)) : Math.max(0, 35 - Math.abs(pos-72)*0.85);
      Sound.press();
      advance();
    }
    label();
  }

  btn.onclick = confirm;
  gaugeActive = confirm;
  stage.addEventListener('pointerdown', e=>{
    if(step !== 2) return;
    const r = stage.getBoundingClientRect();
    slider = clamp(((e.clientX - r.left)/r.width - 0.06)/0.88*100, 0, 100);
    renderStage();
  });
  stage.addEventListener('pointermove', e=>{
    if(step !== 2 || e.buttons === 0) return;
    const r = stage.getBoundingClientRect();
    slider = clamp(((e.clientX - r.left)/r.width - 0.06)/0.88*100, 0, 100);
    renderStage();
  });

  renderStage(); label(); needleLoop();
}

function bakeCake(){
  if(gs.money < bakeCost()) return toast('Không đủ 💰 nguyên liệu!');
  if(gs.inventory.length >= capacity()) return toast(`Quầy đã đầy (${capacity()}) — bán bớt đi!`);
  gs.money -= bakeCost(); refreshHUD();
  Sound.init(); Sound.click();
  runGaugeFlow('🍌 LÀM BÁNH CHUỐI', score => {
    let total = score;
    if(gs.guarantee){ total = Math.max(total, gs.guarantee); gs.guarantee = 0; toast('🌟 Tụ Linh Trận kích hoạt!'); }
    const r = rollRarity(total);
    const count = total >= 95 ? 3 : total >= 80 ? 2 : 1;
    for(let i=0;i<count && gs.inventory.length < capacity();i++){
      gs.inventory.push({ s: Math.round(total), r: RARITY.indexOf(r) });
    }
    gs.totalCakes += count;
    gs.bestScore = Math.max(gs.bestScore, Math.round(total));
    refreshCakes(); refreshHUD(); saveGame();
    Sound.win();
    if(RARITY.indexOf(r) > 0){ screenFlash(r.css); toast(`${r.name}! ×${r.x} giá`); }
    toast(`Điểm ${Math.round(total)}/100 → +${count} bánh`);
    checkAchievements();
  });
}

function rollRarity(score){
  const boost = score >= 90 ? 1.10 : 1;
  let roll = Math.random()*100, acc = 0;
  for(const t of RARITY){ acc += t.p * (t.name === 'Phàm Phẩm' ? 1 : boost); if(roll <= acc) return t; }
  return RARITY[0];
}

function mgSlice(){
  const S = shellGame('🔪 CẮT CHUỐI PHI ĐAO', '<span data-s>Điểm 0</span><span data-t>18.0s</span>');
  let sc = 0, over = false, items = [];
  const sEl = S.ft.querySelector('[data-s]'), tEl = S.ft.querySelector('[data-t]');
  const t0 = performance.now(), DUR = 18;
  const sp = setInterval(()=>{
    if(over) return;
    const bomb = Math.random() < 0.25;
    const el = document.createElement('div');
    el.className = 'absolute select-none'; el.style.fontSize = '26px';
    el.style.left = rnd(8,84) + '%'; el.style.top = '108%';
    el.textContent = bomb ? '💣' : '🍌';
    const it = { el, x: parseFloat(el.style.left), y: 108, vy: -rnd(80,125), vx: rnd(-10,10), bomb, dead:false };
    el.addEventListener('pointerdown', ev=>{
      ev.preventDefault();
      if(it.dead || over) return;
      it.dead = true; el.remove();
      sc = Math.max(0, sc + (it.bomb ? -3 : 1));
      sEl.textContent = 'Điểm ' + sc;
      Sound[it.bomb ? 'bass' : 'coin']();
    });
    S.st.appendChild(el); items.push(it);
  }, 370);
  let last = performance.now();
  (function loop(){
    if(over) return;
    const now = performance.now(), dt = Math.min(0.05,(now-last)/1000); last = now;
    const left = DUR - (now-t0)/1000;
    tEl.textContent = Math.max(0,left).toFixed(1) + 's';
    if(left <= 0) return end();
    items.forEach(it=>{
      if(it.dead) return;
      it.vy += 110*dt; it.y += it.vy*dt; it.x += it.vx*dt;
      it.el.style.top = it.y + '%'; it.el.style.left = it.x + '%';
      if(it.y > 128){ it.dead = true; it.el.remove(); }
    });
    requestAnimationFrame(loop);
  })();
  function end(){
    over = true; clearInterval(sp);
    items.forEach(i=>i.el.remove());
    gameReward(sc*3, 'Cắt Chuối'); setTimeout(S.close, 900);
  }
}

  const target = document.createElement('div');
  target.className = 'absolute left-1/2 top-1/2 rounded-full ring-4 ring-emerald-400/80';
  target.style.cssText = 'width:76px;height:76px;transform:translate(-50%,-50%)';
  S.st.appendChild(target);

  const ring = document.createElement('div');
  ring.className = 'absolute left-1/2 top-1/2 rounded-full ring-4 ring-pink-400';
  S.st.appendChild(ring);

  function nextRound(){
    round++;
    if(round > MAXR) return end();
    rEl.textContent = 'Vòng ' + round + '/' + MAXR;
    scale = 2.2; Sound.click();
  }
  function judge(){
    if(over) return;
    const d = Math.abs(scale - 1);
    const pts = d < 0.08 ? 10 : d < 0.18 ? 6 : 2;
    sc += pts;
    sEl.textContent = 'Điểm ' + sc;
    Sound[pts >= 10 ? 'win' : pts >= 6 ? 'coin' : 'press']();
    burst(new THREE.Vector3(0,1,FLOOR_Z), pts >= 10 ? 0x00ffa3 : 0xff5ec0, pts >= 10 ? 12 : 5);
    if(round >= MAXR) return end();
    setTimeout(nextRound, 260);
  }
  function end(){ over = true; gameReward(sc, 'Nhịp Điệu'); setTimeout(S.close, 900); }
  S.st.addEventListener('pointerdown', judge);
  nextRound();
  let last = performance.now();
  (function loop(){
    if(over) return;
    const now = performance.now(), dt = Math.min(0.05,(now-last)/1000); last = now;
    scale -= dt*1.5;
    if(scale < 0.45) scale = 2.2;
    const px = 76*scale;
    ring.style.width = px + 'px'; ring.style.height = px + 'px';
    ring.style.transform = 'translate(-50%,-50%)';
    requestAnimationFrame(loop);
  })();
}

function mgDodge(){
  const S = shellGame('⚡ NÉ THIÊN LÔI', '<span data-s>Máu ❤❤❤</span><span data-t>20.0s</span>');
  let lives = 3, px = 50, over = false, bolts = [];
  const sEl = S.ft.querySelector('[data-s]'), tEl = S.ft.querySelector('[data-t]');

  const player = document.createElement('div');
  player.className = 'absolute text-2xl'; player.textContent = '🐰';
  player.style.cssText = 'bottom:6px;left:50%;transform:translateX(-50%)';
  S.st.appendChild(player);

  S.st.addEventListener('pointermove', e=>{
    const r = S.st.getBoundingClientRect();
    px = clamp(((e.clientX - r.left)/r.width)*100, 6, 94);
    player.style.left = px + '%';
  });
  S.st.addEventListener('touchmove', e=>{
    const r = S.st.getBoundingClientRect();
    px = clamp(((e.touches[0].clientX - r.left)/r.width)*100, 6, 94);
    player.style.left = px + '%';
  }, {passive:true});

  const t0 = performance.now(), DUR = 20;
  const sp = setInterval(()=>{
    if(over) return;
    const el = document.createElement('div');
    el.className = 'absolute text-xl'; el.textContent = '⚡';
    const x = rnd(5,95);
    el.style.left = x + '%'; el.style.top = '-8%';
    S.st.appendChild(el);
    bolts.push({ el, x, y:-8, vy: rnd(60,105), dead:false });
  }, 480);

  let last = performance.now();
  (function loop(){
    if(over) return;
    const now = performance.now(), dt = Math.min(0.05,(now-last)/1000); last = now;
    const left = DUR - (now-t0)/1000;
    tEl.textContent = Math.max(0,left).toFixed(1) + 's';
    if(left <= 0) return end();
    bolts.forEach(b=>{
      if(b.dead) return;
      b.y += b.vy*dt; b.el.style.top = b.y + '%';
      if(b.y > 82){
        b.dead = true; b.el.remove();
        if(Math.abs(b.x - px) < 12){
          lives--; Sound.bass();
          sEl.textContent = 'Máu ' + '❤'.repeat(Math.max(0,lives)) + '🖤'.repeat(3-Math.max(0,lives));
          if(lives <= 0) return end();
        }
      }
      if(b.y > 115){ b.dead = true; b.el.remove(); }
    });
    bolts = bolts.filter(b=>!b.dead);
    requestAnimationFrame(loop);
  })();

  function end(){
    if(over) return; over = true; clearInterval(sp);
    bolts.forEach(b=>b.el.remove());
    const left = Math.max(0, DUR - (performance.now()-t0)/1000);
    gameReward(left*3 + lives*14, 'Né Thiên Lôi'); setTimeout(S.close, 900);
  }
}

function mgMemory(){
  const S = shellGame('🔯 GHÉP PHÙ VĂN', '<span data-s>Cặp 0/8</span><span data-t>45.0s</span>');
  let matched = 0, open = [], lock = false, ended = false;
  const DUR = 45, t0 = performance.now();
  const sEl = S.ft.querySelector('[data-s]'), tEl = S.ft.querySelector('[data-t]');
  const glyph = ['☯','🔥','💧','🌪','⛰','⚡','🌙','☀'];
  let deck = glyph.concat(glyph).sort(()=>Math.random()-0.5);

  const grid = document.createElement('div');
  grid.className = 'grid h-full grid-cols-4 gap-2 p-2';
  S.st.appendChild(grid);

  deck.forEach(sym=>{
    const c = document.createElement('button');
    c.className = 'rounded-lg bg-slate-800 text-xl font-bold text-transparent transition hover:bg-slate-700';
    c.textContent = sym; c.dataset.on = '';
    c.onpointerdown = ()=>{
      if(lock || ended || c.dataset.on || c.dataset.done) return;
      c.dataset.on = '1';
      c.classList.add('text-amber-200'); c.classList.replace('bg-slate-800','bg-indigo-700');
      open.push(c); Sound.click();
      if(open.length === 2){
        lock = true;
        const [a,b] = open;
        if(a.textContent === b.textContent){
          a.dataset.done = b.dataset.done = '1';
          a.classList.replace('bg-indigo-700','bg-emerald-700');
          b.classList.replace('bg-indigo-700','bg-emerald-700');
          matched++; sEl.textContent = 'Cặp ' + matched + '/8';
          Sound.coin(); open = []; lock = false;
          if(matched === 8) doneNow();
        } else {
          setTimeout(()=>{
            [a,b].forEach(x=>{
              x.dataset.on = '';
              x.classList.remove('text-amber-200');
              x.classList.replace('bg-indigo-700','bg-slate-800');
            });
            open = []; lock = false;
          }, 520);
          Sound.press();
        }
      }
    };
    grid.appendChild(c);
  });

  function doneNow(){
    if(ended) return; ended = true;
    const left = Math.max(0, DUR - (performance.now()-t0)/1000);
    gameReward(70 + left*1.4, 'Ghép Phù Văn'); setTimeout(S.close, 900);
  }
  const tm = setInterval(()=>{
    const left = DUR - (performance.now()-t0)/1000;
    tEl.textContent = Math.max(0,left).toFixed(1) + 's';
    if(left <= 0 && !ended){
      clearInterval(tm); ended = true;
      gameReward(matched*10, 'Ghép Phù Văn'); setTimeout(S.close, 900);
    }
  }, 100);
}

function mgThrow(){
  const S = shellGame('🥏 NÉM BÁNH TRÚNG MA ĐẦU', '<span data-s>Điểm 0</span><span data-r>Lượt 1/5</span>');
  let round = 0, sc = 0, over = false, power = 0, dir = 1, locked = false, tgt = 50;
  const sEl = S.ft.querySelector('[data-s]'), rEl = S.ft.querySelector('[data-r]');

  const lane = document.createElement('div');
  lane.className = 'absolute left-3 right-3 top-1/2 h-2 -translate-y-1/2 rounded-full bg-slate-800';
  S.st.appendChild(lane);

  const target = document.createElement('div');
  target.className = 'absolute top-1/2 -translate-y-1/2 text-2xl'; target.textContent = '👹';
  S.st.appendChild(target);

  const cursor = document.createElement('div');
  cursor.className = 'absolute top-1/2 -translate-y-1/2 text-xl'; cursor.textContent = '🍌';
  S.st.appendChild(cursor);

  function place(){ tgt = rnd(10,90); target.style.left = tgt + '%'; }
  place();

  S.st.addEventListener('pointerdown', ()=>{
    if(over || locked) return;
    locked = true;
    const d = Math.abs(power - tgt);
    const pts = d < 8 ? 20 : d < 16 ? 13 : d < 26 ? 7 : 2;
    sc += pts; sEl.textContent = 'Điểm ' + sc;
    Sound[pts >= 13 ? 'win' : 'press']();
    setTimeout(()=>{
      round++; locked = false;
      if(round >= 5) return end();
      rEl.textContent = 'Lượt ' + (round+1) + '/5';
      place();
    }, 420);
  });

  let last = performance.now();
  (function loop(){
    if(over) return;
    const now = performance.now(), dt = Math.min(0.05,(now-last)/1000); last = now;
    power += dir*dt*95;
    if(power > 100){ power = 100; dir = -1; }
    if(power < 0){ power = 0; dir = 1; }
    cursor.style.left = (8 + power*0.84) + '%';
    requestAnimationFrame(loop);
  })();

  function end(){ over = true; gameReward(sc, 'Ném Bánh'); setTimeout(S.close, 900); }
}

              : `<button data-buyskin="${id}" class="rounded-lg bg-gradient-to-r from-amber-500 to-pink-500 px-3 py-1.5 text-[11px] font-black text-black">${s.price} ${s.cur==='gem'?'💎':'💰'}</button>`}
      </div>`;

        <div class="flex items-center gap-2">

          <div>

function checkAchievements(){

  ACHIEVEMENTS.forEach(a=>{
    if(gs.achievements[a.id] || !a.ok(gs)) return;
    gs.achievements[a.id] = 1; changed = true;
    if(a.m) gs.money += a.m;
    if(a.gem) gs.gems += a.gem;
    toast(`🏆 ${a.n} ${a.m?'+'+a.m+'💰':''}${a.gem?' +'+a.gem+'💎':''}`);
    Sound.win();
  });
  if(changed){ saveGame(); refreshHUD(); renderAchPanel(); }
}

  dock.appendChild(floorBtn);

  const muteBtn = document.createElement('button');
  muteBtn.className = 'rounded-xl bg-slate-800/90 px-2 py-2 text-[10px] font-bold text-slate-200 ring-1 ring-white/10';
  muteBtn.textContent = '🔊';
  muteBtn.onclick = ()=>{ Sound.init(); Sound.toggle(); muteBtn.textContent = Sound.muted?'🔇':'🔊'; };
  dock.appendChild(muteBtn);

  renderSkillDock();
}
function renderSkillDock(){
  document.querySelectorAll('[data-skill]').forEach(b=>{
    const s = SKILLS.find(x=>x.id === b.dataset.skill);
    const locked = gs.realm < s.req;
    const left = Math.max(0, Math.ceil(((gs.skillsCD[s.id]||0) - Date.now())/1000));
    b.className = 'relative h-10 w-10 rounded-xl text-white shadow transition ' +
      (locked ? 'bg-slate-700/60 opacity-40' :
       left   ? 'bg-slate-800/90' :
                'bg-gradient-to-br from-fuchsia-500 to-amber-400 hover:scale-110');
    b.disabled = locked || left > 0;
    b.innerHTML = `<i class="fa-solid ${s.ic}"></i><span class="absolute -right-1 -top-1 rounded bg-black/80 px-1 text-[9px]">${s.key}</span>` +
      (left ? `<span class="absolute inset-0 grid place-items-center rounded-xl bg-black/70 text-[10px]">${left}</span>` : '');
  });
}
function castSkill(id){
  const s = SKILLS.find(x=>x.id === id); if(!s) return;
  if(gs.realm < s.req) return toast('Cảnh giới chưa đủ!');
  if((gs.skillsCD[id]||0) > Date.now()) return;
  Sound.init();
  s.run();
  gs.skillsCD[id] = Date.now() + s.cd*1000;
  saveGame(); refreshHUD(); renderSkillDock();
}

/* ============================================================================
   DAY CYCLE
   ============================================================================ */
function nextDay(){
  gs.day++;
  const gem = 1 + Math.floor(Math.random()*2);
  gs.gems += gem;
  saveGame(); refreshHUD(); checkAchievements();
  Sound.zither();
  toast(`🌙 Sang ngày ${gs.day} · +${gem} 💎`);
  spawnCustomer();
}

/* ============================================================================
   MAIN LOOP
   ============================================================================ */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  tGlobal += dt;

  controls.update();
  if(shakeT > 0){
    shakeT -= dt;
    camera.position.x += (Math.random()-0.5) * shakeAmp;
    camera.position.y += (Math.random()-0.5) * shakeAmp;
  }

  /* bunny idle */
  if(bunnyGroup){
    bunnyGroup.position.y = Math.sin(tGlobal*1.8)*0.035;
    bunnyGroup.rotation.y = Math.sin(tGlobal*0.5)*0.10;
    const h = bunnyGroup.userData;
    if(h.earL && h.earR){
      h.earL.rotation.z = 0.20 + Math.sin(tGlobal*2.15)*0.28;
      h.earL.rotation.x = Math.sin(tGlobal*1.6)*0.14;
      h.earR.rotation.z = -0.20 + Math.sin(tGlobal*2.15+1.1)*0.28;
      h.earR.rotation.x = Math.sin(tGlobal*1.6+0.8)*0.14;
    }
    if(h.head) h.head.rotation.z = Math.sin(tGlobal*1.1)*0.05;
    (h.tails||[]).forEach((tp,i)=>{
      tp.rotation.z = (i-4)*0.20 + Math.sin(tGlobal*2.4 + i*0.7)*0.16;
      tp.rotation.x = -0.35 + Math.cos(tGlobal*1.9 + i*0.5)*0.10;
    });
    if(h.nose) h.nose.scale.setScalar(1 + Math.sin(tGlobal*4)*0.04);
  }

  /* cakes bob */
  if(cakeGroup) cakeGroup.children.forEach((c,i)=>{
    c.position.y = counterTopY + Math.sin(tGlobal*2 + i)*0.012;
    c.rotation.y += dt*0.35;
  });

  /* realm fx */
  if(lotus){ lotus.rotation.y += dt*0.35; }
  danOrbs.forEach((o,i)=>{
    const a = o.userData.a + tGlobal*0.9;
    o.position.set(Math.cos(a)*1.05, 0.75 + Math.sin(tGlobal*2+i)*0.18, Math.sin(a)*1.05 + BUNNY_POS.z);
    o.position.x += BUNNY_POS.x;
  });
  orbitSwords.forEach((s,i)=>{
    const a = s.userData.a + tGlobal*0.55;
    s.position.set(Math.cos(a)*1.55 + BUNNY_POS.x, 0.95 + Math.sin(tGlobal*1.1+i)*0.16, Math.sin(a)*1.55 + BUNNY_POS.z);
    s.rotation.y = -a;
    s.rotation.z = 0.5;
  });
  if(celRing){ celRing.rotation.z += dt*0.6; celRing.rotation.x = Math.PI/2 + Math.sin(tGlobal*0.8)*0.16; }
  if(beam){ beam.material.opacity = 0.10 + Math.abs(Math.sin(tGlobal*2.2))*0.12; beam.rotation.y += dt*0.5; }

  /* aura */
  if(auraPoints){
    const arr = auraPoints.geometry.attributes.position.array;
    const vel = auraPoints.geometry.userData.vel;
    for(let i=0;i<arr.length/3;i++){
      arr[i*3+1] += vel[i*3+1]*dt;
      arr[i*3]   += vel[i*3]*dt;
      arr[i*3+2] += vel[i*3+2]*dt;
      if(arr[i*3+1] > 2.2){
        const ang = Math.random()*Math.PI*2, rad = 0.45 + Math.random()*0.85;
        arr[i*3] = BUNNY_POS.x + Math.cos(ang)*rad;
        arr[i*3+1] = 0;
        arr[i*3+2] = BUNNY_POS.z + Math.sin(ang)*rad;
      }
    }
    auraPoints.geometry.attributes.position.needsUpdate = true;
    if(auraLight) auraLight.intensity = 1.8 + Math.sin(tGlobal*4)*0.5;
  }

  /* fog + dust */
  fogPlanes.forEach((f,i)=>{
    f.position.x += Math.sin(tGlobal*0.2 + i)*dt*f.userData.spd*4;
    f.position.y += dt*f.userData.spd*0.25*f.userData.dir;
    f.rotation.z += dt*f.userData.spd;
    if(f.position.y > 3.4) f.position.y = 0.3;
    if(f.position.y < 0.2) f.position.y = 3.2;
  });
  if(dust){ dust.rotation.y += dt*0.02; }

  /* rune */
  if(runeMesh){ runeMesh.rotation.z += dt*0.08; runeMesh.material.opacity = 0.42 + Math.sin(tGlobal*1.6)*0.12; }

  /* party floor */
  if(partyGroup){
    partyGroup.visible = partyOn || dancers.length > 0;
    tiles.forEach(t=>{
      const w = Math.sin(tGlobal*3 + t.userData.phase);
      t.material.color.setHex(w > 0.94 ? 0xff5ec0 : w > 0.72 ? 0x7c3aed : 0x0b1020);
    });
    if(mirrorBall) mirrorBall.rotation.y += dt*1.4;
    beams.forEach(b=>{ b.rotation.z = b.userData.base + Math.sin(tGlobal*b.userData.spd)*0.45; });
  }

  /* dancers */
  for(let i=dancers.length-1;i>=0;i--){
    const d = dancers[i];
    danceStep(d, tGlobal, dt);
    if(performance.now() - d.born > 26000){
      scene.remove(d.group); disposeNode(d.group); dancers.splice(i,1);
    }
  }
  if(dancers.length){
    payAcc += dt*dancers.length*2;
    if(payAcc >= 1){
      const v = Math.floor(payAcc); gs.money += v; payAcc -= v;
      refreshHUD();
    }
  }

  updateCustomers(dt, tGlobal);
  updateConfetti(dt);

  renderer.render(scene, camera);
}

function disposeNode(node){
  node.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
      else o.material.dispose();
    }
  });
}

/* ---------------- aura apply ---------------- */
function applyAuraFX(){
  buildAura();
  const a = AURAS[gs.aura] || AURAS.off;
  if(a.n > 0){
    screenFlash(a.css); shake(0.45, 0.14);
    burst(new THREE.Vector3(BUNNY_POS.x, 1.2, BUNNY_POS.z), a.color, 24);
    Sound.powerUp();
  }
}

/* ============================================================================
   BOOT
   ============================================================================ */
function boot(){
  loadGame();
  Sound.muted = !gs.sound;

  initScene();
  refreshCakes();
  refreshHUD();
  renderAchPanel();
  buildDock();
  checkAchievements();

  if(!gs.tutorial){
    gs.tutorial = true; saveGame();
    setTimeout(()=>toast('Chào mừng! Bấm LÀM BÁNH để bắt đầu 🍌'), 700);
    setTimeout(()=>toast('Kéo chuột để xoay 360° · lăn để zoom'), 2600);
  }

  /* buttons */
  $('#btnCraft').onclick = ()=>{ Sound.init(); bakeCake(); };
  $('#btnSell').onclick  = ()=>{ Sound.init(); sellAll(); };
  $('#btnShop').onclick  = ()=>{ Sound.init(); openShop(); };
  $('#btnTrib').onclick  = ()=>{ Sound.init(); openTribulation(); };
  $('#btnDay').onclick   = ()=>{ Sound.init(); nextDay(); };
  $('#btnAch').onclick   = ()=>{
    const p = $('#achPanel');
    p.classList.toggle('hidden');
  };

  /* keyboard */
  addEventListener('keydown', e=>{
    const target = e.target;
    const editing = target instanceof HTMLElement &&
      (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(target.tagName));
    const modalOpen = $('#modalRoot').children.length > 0;

    if(e.key === ' '){
      if(gaugeActive){ e.preventDefault(); gaugeActive(); return; }
      if(!modalOpen && !editing){ $('#btnCraft').click(); e.preventDefault(); }
    }
    if(!modalOpen && !editing && ['1','2','3','4'].includes(e.key)){
      castSkill(SKILLS[+e.key-1].id);
    }
    if(e.key === 'Escape') closeModal();
  });

  /* autosave + timers */
  setInterval(()=>{ saveGame(); renderSkillDock(); checkAchievements(); }, 5000);
  setInterval(()=>{ if(Math.random() < 0.6) spawnCustomer(); }, 6500);
  addEventListener('beforeunload', saveGame);

  animate();
  console.log('%c🍌 Poinhoinhoi v5 online', 'color:#f472b6;font-weight:bold');
}

/* chờ CDN three.js load xong */
window.addEventListener('load', ()=>{
  if(typeof THREE === 'undefined'){
    document.body.insertAdjacentHTML('beforeend',
      '<div class="fixed inset-0 z-[99] grid place-items-center bg-black text-center text-sm text-red-300">' +
      'Không tải được Three.js — kiểm tra kết nối mạng rồi tải lại trang.</div>');
    return;
  }
  boot();
});
</script>
